name: PR Check

on:
  pull_request:
    branches: [ main ]

concurrency:
  group: pr-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  mergeable-check:
    name: Verifica conflitos com a main
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configura git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Tenta simular o merge com a main
        run: |
          git fetch origin main
          if ! git merge --no-commit --no-ff origin/main; then
            echo "::error::Conflito detectado entre esta branch e a main. Resolva antes de seguir com o PR."
            exit 1
          fi

  structure-check:
    name: Verifica estrutura do repositório
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Confirma pasta docs/ obrigatória
        run: |
          test -d "docs" || (echo "::error::Pasta 'docs' não encontrada na raiz do repositório." && exit 1)
          echo "Pasta docs/ ok."

  docs-validation:
    name: Valida arquivos em docs/
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Valida extensão, tamanho e nome dos arquivos
        run: |
          ALLOWED_EXT="docx pdf md xlsx pptx png jpg jpeg bpm net"
          MAX_SIZE=$((50 * 1024 * 1024))
          FAIL=0

          while IFS= read -r -d '' file; do
            ext="${file##*.}"
            ext_lower=$(echo "$ext" | tr '[:upper:]' '[:lower:]')
            match=0
            for a in $ALLOWED_EXT; do
              [ "$ext_lower" = "$a" ] && match=1
            done
            if [ "$match" -eq 0 ]; then
              echo "::error file=$file::Extensão não permitida em docs/: .$ext"
              FAIL=1
            fi

            size=$(stat -c%s "$file")
            if [ "$size" -gt "$MAX_SIZE" ]; then
              echo "::error file=$file::Arquivo excede 50MB ($((size / 1024 / 1024))MB)."
              FAIL=1
            fi

            base=$(basename "$file")
            if echo "$base" | grep -qE '[<>:"\\|?*]'; then
              echo "::error file=$file::Nome de arquivo contém caractere inválido."
              FAIL=1
            fi
          done < <(find docs -type f -print0)

          exit $FAIL

  source-branch-check:
    name: Verifica branch de origem
    runs-on: ubuntu-latest
    steps:
      - name: Confirma que o PR vem de 'stage'
        run: |
          if [ "${{ github.head_ref }}" != "stage" ]; then
            echo "::error::PRs para 'main' só são permitidos a partir da branch 'stage'. Origem detectada: ${{ github.head_ref }}"
            exit 1
          fi

  auto-merge:
    name: Habilita auto-merge para main
    needs: [mergeable-check, structure-check, docs-validation, source-branch-check]
    runs-on: ubuntu-latest
    if: |
      github.event.pull_request.head.ref == 'stage' &&
      github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Habilita auto-merge no PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr merge ${{ github.event.pull_request.number }} \
            --squash \
            --auto \
            --repo ${{ github.repository }}

  notify-failure:
    name: Notifica falha no PR
    needs: [mergeable-check, structure-check, docs-validation, source-branch-check]
    runs-on: ubuntu-latest
    if: failure()
    permissions:
      pull-requests: write
    steps:
      - name: Comenta no PR sobre a falha
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr comment ${{ github.event.pull_request.number }} \
            --repo ${{ github.repository }} \
            --body "⚠️ Uma ou mais verificações do PR Check falharam. Confira a aba Actions para detalhes antes de seguir com o merge."