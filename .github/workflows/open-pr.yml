name: Abrir PR para main

on:
  push:
    branches:
      - stage

permissions:
  contents: read
  pull-requests: write

jobs:
  open-pr:
    name: Cria PR de stage para main
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verifica se já existe PR aberto
        id: check-pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          EXISTING=$(gh pr list --base main --head stage --state open --json number --jq '.[0].number')
          echo "existing=$EXISTING" >> "$GITHUB_OUTPUT"

      - name: Cria o PR
        if: steps.check-pr.outputs.existing == ''
        env:
          GH_TOKEN: ${{ secrets.PR_AUTOMATION_TOKEN }}
        run: |
          gh pr create \
            --base main \
            --head stage \
            --title "Merge automático: stage -> main" \
            --body "PR aberto automaticamente após push em stage. Aguardando verificações do PR Check."
